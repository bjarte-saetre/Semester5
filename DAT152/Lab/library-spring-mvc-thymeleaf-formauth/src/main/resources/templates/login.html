<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Update Book</title>
    <link rel="stylesheet" type="text/css" href="/css/styles.css" th:href="@{/css/styles.css}" />
</head>
<body>
<main class="container">
    <div>
        <a href="/">Login</a>
    </div>
    <div>
        <form th:action="@{/login}" method="post" enctype="multipart/form-data">
            <table>
                <tr>
                    <td>Username:</td>
                    <td><input name="username" /></td>
                </tr>
                <tr>
                    <td>Password:</td>
                    <td><input type="password" name="password" /></td>
                </tr>
                <tr>
                    <td></td>
                    <td><input th:type="submit" value="Submit" name="submit"></td>
                </tr>
            </table>
            <br>
            <div>

            </div>
        </form>
    </div>
</main>
</body>
</html>
