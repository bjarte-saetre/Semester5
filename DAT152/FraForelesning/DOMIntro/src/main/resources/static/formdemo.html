    <link href="main.css" rel="stylesheet" type="text/css" />
    <link href="course.css" rel="stylesheet" type="text/css" />
    <script src="js/formdemo.js" defer></script>
    <title>Demo of FORM with input elements</title>
</head>

<body>
    <div id="root">
        <h1>Welcome to <span>course</span></h1>
        <form>
            <fieldset>
                <legend>Fill in course details</legend>
                <label for="coursename">Name of course:</label><input type="text" placeholder="Name of course" name="coursename" id="coursename" />
                <label for="lecturer">Lecturer:</label><input type="text" placeholder="Name of lecturer" name="lecturer" id="lecturer" />
                <button type="submit">Register course details</button>
            </fieldset>
        </form>
    </div>
</body>
